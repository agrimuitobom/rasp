name: 新しいコードを追加
description: ラズパイコードを追加する
title: "[新規コード] "
labels: ["新規コード"]
body:
  - type: markdown
    attributes:
      value: |
        ## 新しいラズパイコードを追加
        このフォームに必要事項を入力してください。送信すると自動的にサイトに追加されます！

  - type: input
    id: code-id
    attributes:
      label: コードID
      description: 英数字とハイフンのみ（例：ultrasonic-sensor）
      placeholder: ultrasonic-sensor
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: タイトル
      description: 絵文字付きで入力してください
      placeholder: "📏 超音波距離センサー"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 説明
      description: このコードの説明を入力してください
      placeholder: 超音波で距離を測定するプログラムです。
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: 難易度
      options:
        - 初級
        - 中級
        - 上級
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: タグ
      description: カンマ区切りで入力（例：センサー, 距離測定, IoT）
      placeholder: センサー, 距離測定
    validations:
      required: true

  - type: input
    id: filename
    attributes:
      label: ファイル名
      description: Pythonファイル名（.py拡張子を含む）
      placeholder: ultrasonic_sensor.py
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Pythonコード
      description: コード全体を貼り付けてください
      placeholder: |
        from gpiozero import LED
        from time import sleep

        # ここにコードを入力
      render: python
    validations:
      required: true

  - type: textarea
    id: connection
    attributes:
      label: 接続方法
      description: ハードウェアの接続方法を記述
      placeholder: |
        VCC→5V
        GND→GND
        Trig→GPIO23
        Echo→GPIO24

  - type: input
    id: command
    attributes:
      label: 実行コマンド
      description: プログラムを実行するコマンド
      placeholder: python3 ultrasonic_sensor.py
      value: python3
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 備考・注意事項
      description: セットアップ手順やトラブルシューティングなど
      placeholder: |
        ライブラリのインストールが必要です：
        pip3 install <ライブラリ名>
